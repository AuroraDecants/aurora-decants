<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Decants Perfumaria</title>
<meta name="description" content="Aurora Decants Perfumaria. +3.000 clientes perfumados desde 2023.">
<meta name="theme-color" content="#f6f4f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --fundo:#f6f4f1;
  --grafite:#1a1a1f;
  --aco:#666a73;
  --linha:#e0ddd8;
  --texto:#1a1a1f;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--texto);line-height:1.35;
  background:radial-gradient(120% 55% at 50% 0%,#ffffff 0%,var(--fundo) 60%),var(--fundo);
  background-color:var(--fundo);
  overflow-x:hidden;
}
a{color:inherit;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid var(--grafite);outline-offset:3px}

.vitrine{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.vitrine img{position:absolute;height:auto;opacity:.17;filter:saturate(.75);transform:rotate(var(--r))}
.ar{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ar i{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle,rgba(120,124,132,.16),rgba(120,124,132,0) 70%);filter:blur(6px);animation:sobeNevoa linear infinite}
@keyframes sobeNevoa{from{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1}to{transform:translateY(-110vh) translateX(var(--d)) scale(1.6);opacity:0}}

main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:40px 16px 28px}
.topo{text-align:center}
.logo{width:180px;height:180px;margin:0 auto;border-radius:50%;background:#000;border:3px solid #c4c8cf;padding:22px;
  box-shadow:0 0 0 5px rgba(255,255,255,.9),0 0 0 6px #d9d6d1,0 20px 28px -12px rgba(26,26,31,.45);
  animation:entra 1s cubic-bezier(.2,.8,.3,1) both}
.logo img{width:100%;height:100%;display:block;border-radius:50%;object-fit:contain}
@keyframes entra{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
h1{margin:24px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;line-height:1.02;font-weight:700;letter-spacing:.01em;text-wrap:balance;
  background:linear-gradient(180deg,#0f0f12 15%,#3b3d44 60%,#6b6f78 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.frase{margin:10px 0 0;font-size:16px;color:var(--aco);letter-spacing:.02em}

.pedido{display:flex;align-items:center;gap:14px;margin-top:30px;padding:16px 18px;border-radius:18px;text-decoration:none;color:#fff;
  background:linear-gradient(180deg,#3a3b42 0%,#15151a 55%,#202126 100%);
  box-shadow:0 16px 28px -14px rgba(26,26,31,.65),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s ease,filter .15s ease}
.pedido:active{transform:scale(.98)}
@media (hover:hover){.pedido:hover{filter:brightness(1.15)}}
.pedido .ic{flex:0 0 48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pedido .ic svg{width:28px;height:28px}
.pedido strong{display:block;font-size:19px;font-weight:600;line-height:1.15}
.pedido small{display:block;font-size:14px;margin-top:2px;color:#c9ccd2}

.painel{margin-top:14px;border-radius:20px;background:rgba(255,255,255,.82);border:1px solid var(--linha);
  box-shadow:0 14px 28px -20px rgba(26,26,31,.4);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:15px 18px;text-decoration:none;transition:background .12s ease}
.item+.item{border-top:1px solid var(--linha)}
.item:active{background:#efece8}
@media (hover:hover){.item:hover{background:#f6f3ef}}
.item svg{flex:0 0 26px;width:26px;height:26px}
.item span{flex:1;min-width:0}
.item strong{display:block;font-size:17px;font-weight:600}
.item small{display:block;font-size:14px;color:var(--aco);margin-top:1px;overflow-wrap:anywhere}

footer{margin-top:30px;text-align:center;font-size:14px;color:var(--aco)}

.borrifo{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-radius:50%;width:var(--t);height:var(--t);
  background:radial-gradient(circle,rgba(70,74,82,.75),rgba(110,114,122,.3) 55%,rgba(110,114,122,0) 72%);
  animation:borrifa var(--s) ease-out forwards;will-change:transform,opacity}
@keyframes borrifa{
  0%{transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(.4);opacity:.9}
  100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) translate(-50%,-50%) scale(var(--e));opacity:0}}
.pedido,.painel{animation:paira 5s ease-in-out infinite}
.painel{animation-duration:6s;animation-delay:-2.5s}
@keyframes paira{0%,100%{translate:0 0}50%{translate:0 -11px}}
@media (prefers-reduced-motion:reduce){.ar i{animation:none;opacity:0}.logo,.pedido,.painel{animation:none}.pedido,.item{transition:none}}
</style>
</head>

<script>
/* Fundo: névoa de perfume subindo devagar */
(function () {
  var ar = document.getElementById('ar');
  if (!ar || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  for (var i = 0; i < 7; i++) {
    var n = document.createElement('i'), t = 90 + Math.random() * 120;
    n.style.cssText = 'left:' + (Math.random() * 100) + '%;width:' + t + 'px;height:' + t + 'px;--d:' + (Math.random() * 120 - 60) + 'px;animation-duration:' + (16 + Math.random() * 14) + 's;animation-delay:-' + (Math.random() * 24) + 's';
    ar.appendChild(n);
  }
})();

/* Borrifada: o toque (ou clique) solta um spray; o mouse deixa uma névoa fina */
(function () {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ultimo = null, vivas = 0;
  function gota(x, y, ang, dist, tam, dur) {
    if (vivas > 70) return;
    var e = document.createElement('span');
    e.className = 'borrifo';
    e.setAttribute('aria-hidden', 'true');
    e.style.setProperty('--x', x + 'px');
    e.style.setProperty('--y', y + 'px');
    e.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    e.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    e.style.setProperty('--t', tam + 'px');
    e.style.setProperty('--e', (1 + Math.random() * 1.6).toFixed(2));
    e.style.setProperty('--s', dur + 'ms');
    vivas++;
    e.addEventListener('animationend', function () { e.remove(); vivas--; });
    document.body.appendChild(e);
  }
  window.addEventListener('pointermove', function (ev) {
    var x = ev.clientX, y = ev.clientY;
    if (ultimo && Math.hypot(x - ultimo[0], y - ultimo[1]) < 16) return;
    ultimo = [x, y];
    gota(x, y, -Math.PI / 2 + (Math.random() - .5) * 1.2, 26 + Math.random() * 30, 14 + Math.random() * 14, 1400);
  }, { passive: true });
  window.addEventListener('pointerdown', function (ev) {
    for (var i = 0; i < 18; i++) {
      var a = -Math.PI / 2 + (Math.random() - .5) * 1.5;
      gota(ev.clientX, ev.clientY, a, 50 + Math.random() * 90, 4 + Math.random() * 7, 700 + Math.random() * 500);
    }
  }, { passive: true });
})();
</script>
